name: Build and deploy Bakery frontend

on:
  push:
    branches:
      - main
    paths:
      - Bakery.Client/**
      - .github/workflows/azure-static-web-app.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  VITE_API_BASE_URL: https://dambo-efhgg7ddhaetanc9.southeastasia-01.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Bakery.Client/package-lock.json

      - name: Install dependencies
        working-directory: Bakery.Client
        run: npm ci

      - name: Build frontend
        working-directory: Bakery.Client
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: /Bakery.Client/dist
          output_location: ''
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
