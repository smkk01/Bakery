name: Build and deploy Bakery API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  API_PROJECT: Bakery.Api/Bakery.Api.csproj

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Bakery.sln

      - name: Build
        run: dotnet build Bakery.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Bakery.Tests/Bakery.Tests.csproj --configuration Release --no-build

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
