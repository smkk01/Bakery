name: Build and deploy Bakery API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  API_PROJECT: Bakery.Api/Bakery.Api.csproj

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Bakery.sln

      - name: Build
        run: dotnet build Bakery.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Bakery.Tests/Bakery.Tests.csproj --configuration Release --no-build

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ./publish

      - name: Validate Azure deployment credentials
        shell: pwsh
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_NAME)) {
            throw "Missing AZURE_WEBAPP_NAME. Add it to the production environment secrets."
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_PUBLISH_PROFILE)) {
            throw "Missing AZURE_WEBAPP_PUBLISH_PROFILE. Add the full Azure publish-profile XML to the production environment secrets."
          }

          try {
            [xml]$profile = $env:AZURE_WEBAPP_PUBLISH_PROFILE
          }
          catch {
            throw "AZURE_WEBAPP_PUBLISH_PROFILE is not valid XML. Download a fresh publish profile from the target App Service."
          }

          if ($null -eq $profile.publishData.publishProfile) {
            throw "AZURE_WEBAPP_PUBLISH_PROFILE does not contain Azure publish profile data. Use the full downloaded XML file."
          }

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
