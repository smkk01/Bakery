name: Build and deploy Bakery API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 8.0.x
  API_PROJECT: Bakery.Api/Bakery.Api.csproj

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Bakery.sln

      - name: Build
        run: dotnet build Bakery.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Bakery.Tests/Bakery.Tests.csproj --configuration Release --no-build

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ./publish

      - name: Validate Azure deployment settings
        shell: pwsh
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_NAME)) {
            throw "Missing AZURE_WEBAPP_NAME. Add the App Service name to the production environment secrets."
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            throw "Missing AZURE_CLIENT_ID. Add the Microsoft Entra application (client) ID to the production environment secrets."
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            throw "Missing AZURE_TENANT_ID. Add the Microsoft Entra tenant ID to the production environment secrets."
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) {
            throw "Missing AZURE_SUBSCRIPTION_ID. Add the Azure subscription ID to the production environment secrets."
          }

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./publish
